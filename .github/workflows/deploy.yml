name: Deploy React App

on:
  push:
    branches: [ "main" ] # Đổi thành "master" nếu nhánh chính của bạn tên là master

# Cấp quyền cho GitHub Actions có thể deploy lên GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Đổi thành ./build nếu bạn dùng Create React App cũ thay vì Vite
