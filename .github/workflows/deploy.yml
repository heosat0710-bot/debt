name: Build and Deploy React

on:
  push:
    branches: [ "main" ] # Hoặc master tùy dự án của bạn

permissions:
  contents: write # Cấp quyền ghi để tạo nhánh gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.output/public # Đẩy thẳng thư mục public này lên nhánh tĩnh
          publish_branch: gh-pages
